<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Calculator Web Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --operator-bg: #4f46e5;
            --operator-hover: #4338ca;
            --equal-bg: #10b981;
            --equal-hover: #059669;
            --action-color: #f87171;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 26px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .header {
            padding: 24px 24px 14px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #a5b4fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .screen {
            padding: 18px 24px;
            background: rgba(15, 23, 42, 0.85);
            margin: 0 20px 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: right;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .screen-history {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-muted);
            min-height: 22px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .screen-current {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.3rem;
            font-weight: 700;
            color: #38bdf8;
            margin-top: 4px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 0 20px 24px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 14px;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            color: var(--text-main);
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        button:hover {
            transform: translateY(-2px);
            background: rgba(71, 85, 105, 0.8);
        }

        button:active {
            transform: translateY(1px);
        }

        button.operator {
            background: var(--operator-bg);
            color: #fff;
        }

        button.operator:hover {
            background: var(--operator-hover);
        }

        button.action {
            background: rgba(239, 68, 68, 0.2);
            color: var(--action-color);
            border-color: rgba(239, 68, 68, 0.3);
        }

        button.equal {
            background: var(--equal-bg);
            color: #fff;
        }

        button.equal:hover {
            background: var(--equal-hover);
        }

        .zero-btn {
            grid-column: span 2;
        }

        .history-section {
            padding: 16px 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.4);
        }

        .history-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            height: auto;
        }

        .clear-btn:hover {
            color: #f87171;
            background: rgba(239, 68, 68, 0.1);
        }

        .history-list {
            max-height: 110px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            color: #cbd5e1;
        }

        .history-item span.res {
            color: #38bdf8;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            padding-bottom: 16px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Web Calculator</h1>
            <p>100% Standalone Web Page • Works Without Terminal</p>
        </div>

        <div class="screen">
            <div class="screen-history" id="subDisplay">&nbsp;</div>
            <div class="screen-current" id="mainDisplay">0</div>
        </div>

        <div class="keypad">
            <button class="action" onclick="clearAll()">AC</button>
            <button class="action" onclick="backspace()">⌫</button>
            <button class="action" onclick="toggleSign()">±</button>
            <button class="operator" onclick="chooseOp('/')">÷</button>

            <button onclick="appendNum('7')">7</button>
            <button onclick="appendNum('8')">8</button>
            <button onclick="appendNum('9')">9</button>
            <button class="operator" onclick="chooseOp('*')">×</button>

            <button onclick="appendNum('4')">4</button>
            <button onclick="appendNum('5')">5</button>
            <button onclick="appendNum('6')">6</button>
            <button class="operator" onclick="chooseOp('-')">−</button>

            <button onclick="appendNum('1')">1</button>
            <button onclick="appendNum('2')">2</button>
            <button onclick="appendNum('3')">3</button>
            <button class="operator" onclick="chooseOp('+')">+</button>

            <button class="zero-btn" onclick="appendNum('0')">0</button>
            <button onclick="appendDot()">.</button>
            <button class="equal" onclick="calculateResult()">=</button>
        </div>

        <div class="history-section">
            <div class="history-title">
                <span>Recent Calculations</span>
                <button class="clear-btn" onclick="clearHistory()">Clear</button>
            </div>
            <div class="history-list" id="historyList">
                <div style="font-size:0.75rem; color:#64748b; text-align:center; padding: 8px;">No calculations yet</div>
            </div>
        </div>

        <div class="footer">
            Runs directly in your browser • Keyboard & Touch Friendly
        </div>
    </div>

    <script>
        let currentInput = "0";
        let storedNum = null;
        let pendingOp = null;
        let resetScreen = false;
        let historyRecords = [];

        const mainDisplay = document.getElementById("mainDisplay");
        const subDisplay = document.getElementById("subDisplay");
        const historyList = document.getElementById("historyList");

        function updateDisplay() {
            mainDisplay.textContent = currentInput;
            if (storedNum !== null && pendingOp) {
                const opSymbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };
                subDisplay.textContent = `${storedNum} ${opSymbols[pendingOp] || pendingOp}`;
            } else {
                subDisplay.innerHTML = "&nbsp;";
            }
        }

        function appendNum(num) {
            if (currentInput === "0" || resetScreen) {
                currentInput = num;
                resetScreen = false;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendDot() {
            if (resetScreen) {
                currentInput = "0.";
                resetScreen = false;
            } else if (!currentInput.includes(".")) {
                currentInput += ".";
            }
            updateDisplay();
        }

        function toggleSign() {
            if (currentInput !== "0" && currentInput !== "Error" && currentInput !== "Cannot divide by 0") {
                currentInput = currentInput.startsWith("-") ? currentInput.slice(1) : "-" + currentInput;
                updateDisplay();
            }
        }

        function backspace() {
            if (resetScreen || currentInput.includes("Error") || currentInput.includes("Cannot")) {
                currentInput = "0";
                resetScreen = false;
            } else {
                currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : "0";
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = "0";
            storedNum = null;
            pendingOp = null;
            resetScreen = false;
            updateDisplay();
        }

        function chooseOp(op) {
            if (storedNum !== null && pendingOp && !resetScreen) {
                calculateResult();
            }
            storedNum = parseFloat(currentInput);
            pendingOp = op;
            resetScreen = true;
            updateDisplay();
        }

        function calculateResult() {
            if (storedNum === null || !pendingOp) return;

            const num1 = storedNum;
            const num2 = parseFloat(currentInput);
            let result;

            if (pendingOp === "/" && num2 === 0) {
                currentInput = "Cannot divide by 0";
                storedNum = null;
                pendingOp = null;
                resetScreen = true;
                updateDisplay();
                return;
            }

            switch (pendingOp) {
                case "+": result = num1 + num2; break;
                case "-": result = num1 - num2; break;
                case "*": result = num1 * num2; break;
                case "/": result = num1 / num2; break;
                default: return;
            }

            // Clean decimal formatting
            const resultStr = String(Math.round(result * 10000000) / 10000000);
            const opSymbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };
            subDisplay.textContent = `${num1} ${opSymbols[pendingOp]} ${num2} =`;
            currentInput = resultStr;

            historyRecords.unshift({ n1: num1, sym: opSymbols[pendingOp], n2: num2, res: resultStr });
            renderHistory();

            storedNum = null;
            pendingOp = null;
            resetScreen = true;
            mainDisplay.textContent = currentInput;
        }

        function renderHistory() {
            if (historyRecords.length === 0) {
                historyList.innerHTML = `<div style="font-size:0.75rem; color:#64748b; text-align:center; padding: 8px;">No calculations yet</div>`;
                return;
            }
            historyList.innerHTML = historyRecords.slice(0, 10).map(item => `
                <div class="history-item">
                    <span>${item.n1} ${item.sym} ${item.n2}</span>
                    <span class="res">= ${item.res}</span>
                </div>
            `).join('');
        }

        function clearHistory() {
            historyRecords = [];
            renderHistory();
        }

        // Full keyboard support
        document.addEventListener("keydown", (e) => {
            if (e.key >= "0" && e.key <= "9") appendNum(e.key);
            else if (e.key === ".") appendDot();
            else if (e.key === "+") chooseOp("+");
            else if (e.key === "-") chooseOp("-");
            else if (e.key === "*") chooseOp("*");
            else if (e.key === "/") { e.preventDefault(); chooseOp("/"); }
            else if (e.key === "Enter" || e.key === "=") calculateResult();
            else if (e.key === "Backspace") backspace();
            else if (e.key.toLowerCase() === "c" || e.key === "Escape") clearAll();
        });
    </script>
</body>
</html>
